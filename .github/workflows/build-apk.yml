name: Build Release APKs（仅手动触发）

# 设计约束：
# - 只接受手动触发（workflow_dispatch），push/PR/定时都不会自动执行；
# - 只构建 + 上传构建产物（artifact），绝不创建/发布 GitHub Release。
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Portal Release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # 完整历史：版本号里的 commit 计数/哈希依赖 git 历史
          fetch-depth: 0

      - name: Setup Java 21
        uses: gmitch215/setup-java@6d2c5e1f82f180ae79f799f0ed6e3e5efb4e664d
        with:
          distribution: jetbrains
          java-version: 21

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-core-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: gradle-deps

      - name: Cache Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-core-${{ github.sha }}
          restore-keys: gradle-builds

      # 签名可选：配置了签名 secrets 才签名；否则产出未签名 release 包（可本地再签）。
      - name: Prepare signing keystore (optional)
        if: ${{ secrets.SIGN_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.SIGN_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.SIGN_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.SIGN_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build release APKs (no debug symbols / no debug logs)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --build-cache --parallel

      - name: Set APK paths
        run: |
          echo "APK_ALL=$(find app/build/outputs/apk/app/release -name '*.apk' | head -1)" >> $GITHUB_ENV
          echo "APK_ARM64=$(find app/build/outputs/apk/arm64/release -name '*.apk' | head -1)" >> $GITHUB_ENV
          echo "APK_X64=$(find app/build/outputs/apk/x64/release -name '*.apk' | head -1)" >> $GITHUB_ENV

      - name: Show Artifacts SHA256
        run: |
          echo "### Build Success :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "|ABI|SHA256|" >> $GITHUB_STEP_SUMMARY
          echo "|:--------:|:----------|" >> $GITHUB_STEP_SUMMARY
          for v in ALL ARM64 X64; do
            fname="APK_$v"
            f="${!fname}"
            if [ -n "$f" ]; then
              echo "|$v|$(sha256sum "$f" | cut -d' ' -f1)|" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload ALL APK
        uses: actions/upload-artifact@v4
        if: ${{ env.APK_ALL != '' }}
        with:
          name: portal-all
          path: ${{ env.APK_ALL }}

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        if: ${{ env.APK_ARM64 != '' }}
        with:
          name: portal-arm64
          path: ${{ env.APK_ARM64 }}

      - name: Upload X64 APK
        uses: actions/upload-artifact@v4
        if: ${{ env.APK_X64 != '' }}
        with:
          name: portal-x64
          path: ${{ env.APK_X64 }}
