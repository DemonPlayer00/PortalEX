[versions]
agp = "9.3.0"
# libxposed 现代 API。2026-09-18 从 101 升到 **102**：要用 102 才有的热重载回调
# （onHotReloading/onHotReloaded + HotReloadedParam.getOldHookHandles），目标是
# "换模块 APK 后 system_server 无需重启"。代价：minApiVersion 一起提到 102，
# 只实现 101 的框架上不再加载。设备实测：LSPosed v2.2.0 (7854) 的 framework.dex 自带完整 102 面。
libxposed = "102.0.0"
kotlin = "2.4.20"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
lifecycleLivedataKtx = "2.8.7"
lifecycleViewmodelKtx = "2.8.7"
navigationFragmentKtx = "2.8.3"
navigationUiKtx = "2.8.3"
jetbrainsKotlinJvm = "2.4.20"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }
fastjson = { module = "com.alibaba.fastjson2:fastjson2-kotlin", version = "2.0.56" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version = "4.12.0" }
geotools = {module = "net.sf.geographiclib:GeographicLib-Java", version = "2.0"}
# 纯 Java 的 XZ 解压（公有领域）。用途：模块在 system_server 内解析平台库
# libsensorservice.so 的 .gnu_debugdata（xz 压缩的 mini debug info）以取得
# 隐藏符号地址。系统自带的 liblzma.so 是 7-Zip LZMA SDK，没有 xz-utils 的
# 流式解码 API，故不能走原生解压。
xz = { module = "org.tukaani:xz", version = "1.10" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
